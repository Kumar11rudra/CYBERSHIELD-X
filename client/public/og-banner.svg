<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="ogBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#071b38"/>
      <stop offset="50%" stop-color="#020914"/>
      <stop offset="100%" stop-color="#010408"/>
    </radialGradient>

    <!-- Neon Cyber Gradients -->
    <linearGradient id="neonCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>

    <linearGradient id="neonEmeraldCyan" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <linearGradient id="shieldFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09254d"/>
      <stop offset="100%" stop-color="#020a17"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(12, 35, 68, 0.65)"/>
      <stop offset="100%" stop-color="rgba(3, 10, 24, 0.85)"/>
    </linearGradient>

    <linearGradient id="statPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 212, 255, 0.12)"/>
      <stop offset="100%" stop-color="rgba(0, 255, 136, 0.08)"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="shieldSquircle">
      <rect width="320" height="320" rx="68"/>
    </clipPath>
  </defs>

  <!-- 1200x1200 Base Canvas for 1200x630 Centered Crop (Visible vertical area is y=285 to y=915) -->
  <rect width="1200" height="1200" fill="url(#ogBg)"/>

  <!-- Tactical Cyber Grid (Centered vertically around y=600) -->
  <g opacity="0.10" stroke="#00d4ff" stroke-width="1.2">
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="680" x2="1200" y2="680"/>
    <line x1="0" y1="760" x2="1200" y2="760"/>
    <line x1="0" y1="840" x2="1200" y2="840"/>

    <line x1="120" y1="0" x2="120" y2="1200"/>
    <line x1="280" y1="0" x2="280" y2="1200"/>
    <line x1="440" y1="0" x2="440" y2="1200"/>
    <line x1="600" y1="0" x2="600" y2="1200"/>
    <line x1="760" y1="0" x2="760" y2="1200"/>
    <line x1="920" y1="0" x2="920" y2="1200"/>
    <line x1="1080" y1="0" x2="1080" y2="1200"/>
  </g>

  <!-- Volumetric Cyber Glow Cones -->
  <circle cx="280" cy="600" r="220" fill="#00d4ff" opacity="0.16" filter="url(#intenseGlow)"/>
  <circle cx="1000" cy="580" r="240" fill="#00ff88" opacity="0.10" filter="url(#intenseGlow)"/>
  <circle cx="650" cy="500" r="300" fill="#0077ff" opacity="0.08" filter="url(#intenseGlow)"/>

  <!-- Top and Bottom Cyber Accent Lines (Within 630 crop: y=295 & y=905) -->
  <line x1="60" y1="305" x2="1140" y2="305" stroke="url(#neonCyanEmerald)" stroke-width="2" opacity="0.4"/>
  <line x1="60" y1="895" x2="1140" y2="895" stroke="url(#neonCyanEmerald)" stroke-width="2" opacity="0.4"/>

  <!-- Corner HUD Crosshairs -->
  <g stroke="#00f0ff" stroke-width="2" opacity="0.7">
    <path d="M 60 325 L 60 305 L 80 305"/>
    <path d="M 1140 325 L 1140 305 L 1120 305"/>
    <path d="M 60 875 L 60 895 L 80 895"/>
    <path d="M 1140 875 L 1140 895 L 1120 895"/>
  </g>

  <!-- ══════════════ LEFT HERO EMBLEM GLASSMORPHIC MODULE ══════════════ -->
  <!-- Module Container at (x=100, y=440), Size 320x320 -->
  <g transform="translate(100, 440)">
    <!-- Glassmorphic Card Backdrop -->
    <rect width="320" height="320" rx="36" fill="url(#cardGrad)" stroke="url(#neonCyanEmerald)" stroke-width="2.5" opacity="0.95"/>
    <rect width="308" height="308" x="6" y="6" rx="30" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Subtle Circuit Tracks in Icon Card -->
    <g opacity="0.25" stroke="#00d4ff" stroke-width="1.5">
      <path d="M20 50 L50 50 L70 30"/>
      <circle cx="20" cy="50" r="3" fill="#00d4ff"/>
      <path d="M300 270 L270 270 L250 290"/>
      <circle cx="300" cy="270" r="3" fill="#00d4ff"/>
    </g>

    <!-- The Exact Beloved CyberShield X Logo (Scale 0.54 inside card) -->
    <g transform="translate(22, 22) scale(0.54)">
      <!-- Shield Outer Glow -->
      <path
        d="M256 46 L430 114 L430 286 C430 380 256 458 256 458 C256 458 82 380 82 286 L82 114 Z"
        fill="url(#shieldFillGrad)"
        stroke="url(#neonCyanEmerald)"
        stroke-width="18"
        stroke-linejoin="round"
        filter="url(#softGlow)"
      />

      <!-- Shield Inner Trim -->
      <path
        d="M256 78 L398 134 L398 276 C398 350 256 422 256 422 C256 422 114 350 114 276 L114 134 Z"
        fill="none"
        stroke="url(#neonEmeraldCyan)"
        stroke-width="6"
        opacity="0.55"
        stroke-dasharray="16 8"
      />

      <!-- Circuit Nodes -->
      <g stroke="#00d4ff" stroke-width="4.5" fill="none" opacity="0.9">
        <path d="M140 190 L180 190 L205 215"/>
        <circle cx="140" cy="190" r="6" fill="#00d4ff"/>
        <path d="M130 270 L170 270 L195 245"/>
        <circle cx="130" cy="270" r="6" fill="#00d4ff"/>
      </g>

      <!-- Radar Arc -->
      <g stroke="#00ff88" stroke-width="3.5" fill="none" opacity="0.8">
        <path d="M340 180 A 90 90 0 0 1 380 270" stroke-dasharray="8 6"/>
        <circle cx="370" cy="225" r="5" fill="#00ff88"/>
      </g>

      <!-- Central 'X' Outer Neon -->
      <path
        d="M176 172 L234 246 L176 320 L214 320 L256 266 L298 320 L336 320 L278 246 L336 172 L298 172 L256 226 L214 172 Z"
        fill="url(#neonCyanEmerald)"
        filter="url(#intenseGlow)"
      />

      <!-- Central 'X' Pure White Core -->
      <path
        d="M188 180 L238 246 L188 312 L206 312 L256 252 L306 312 L324 312 L274 246 L324 180 L306 180 L256 240 L206 180 Z"
        fill="#ffffff"
      />

      <!-- Security Core Anchor -->
      <circle cx="256" cy="246" r="14" fill="#020814" stroke="url(#neonCyanEmerald)" stroke-width="3.5"/>
      <circle cx="256" cy="246" r="5" fill="#00ff88"/>
    </g>

    <!-- Tactical HUD Corner Brackets on Card -->
    <g stroke="#00ff88" stroke-width="2" opacity="0.8">
      <path d="M 12 24 L 12 12 L 24 12"/>
      <path d="M 308 24 L 308 12 L 296 12"/>
      <path d="M 12 296 L 12 308 L 24 308"/>
      <path d="M 308 296 L 308 308 L 296 308"/>
    </g>
  </g>

  <!-- ══════════════ RIGHT HIGH-TECH CONTENT ARCHITECTURE ══════════════ -->
  <g transform="translate(470, 0)">
    <!-- Top Pill: Next-Gen Platform Tag -->
    <g transform="translate(0, 360)">
      <rect width="450" height="32" rx="16" fill="rgba(0, 212, 255, 0.12)" stroke="rgba(0, 212, 255, 0.35)" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="4" fill="#00ff88" filter="url(#softGlow)"/>
      <text x="32" y="21" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="700" font-size="11" fill="#00f0ff" letter-spacing="2">
        NEXT-GEN AI THREAT INTEL &amp; SOC SUITE
      </text>
    </g>

    <!-- Main Typography: CYBERSHIELD X -->
    <text x="0" y="465" font-family="'Orbitron', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="1.5">
      CYBER<tspan fill="#00d4ff">SHIELD</tspan> <tspan fill="#00ff88">X</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="21" fill="#e2e8f0" letter-spacing="0.2">
      Enterprise Multi-Vector Threat Intelligence Platform
    </text>
    <text x="0" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#94a3b8">
      Real-Time URL, Domain, IP, File Hash, SSL &amp; Playbook Diagnostics
    </text>

    <!-- 3 High-Impact Cyber Feature Cards (x=0, y=595) -->
    <g transform="translate(0, 595)">
      <!-- Card 1: 110+ Modules -->
      <g transform="translate(0, 0)">
        <rect width="195" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(0, 212, 255, 0.3)" stroke-width="1.2"/>
        <text x="16" y="32" font-family="'Orbitron', monospace" font-weight="900" font-size="20" fill="#00d4ff">
          110+
        </text>
        <text x="16" y="54" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="10" fill="#94a3b8" letter-spacing="1">
          THREAT MODULES
        </text>
      </g>

      <!-- Card 2: 35+ Intel Feeds -->
      <g transform="translate(210, 0)">
        <rect width="195" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1.2"/>
        <text x="16" y="32" font-family="'Orbitron', monospace" font-weight="900" font-size="20" fill="#00ff88">
          35+
        </text>
        <text x="16" y="54" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="10" fill="#94a3b8" letter-spacing="1">
          LIVE INTEL FEEDS
        </text>
      </g>

      <!-- Card 3: 24/7 AI SOC -->
      <g transform="translate(420, 0)">
        <rect width="210" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2"/>
        <text x="16" y="32" font-family="'Orbitron', monospace" font-weight="900" font-size="20" fill="#c084fc">
          24/7 SOC
        </text>
        <text x="16" y="54" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="10" fill="#94a3b8" letter-spacing="1">
          AI COPILOT TRIAGE
        </text>
      </g>
    </g>

    <!-- Bottom Status & Domain Strip (x=0, y=710) -->
    <g transform="translate(0, 710)">
      <!-- Domain Pill -->
      <rect width="220" height="38" rx="10" fill="rgba(0, 255, 136, 0.12)" stroke="rgba(0, 255, 136, 0.4)" stroke-width="1.2"/>
      <text x="22" y="24" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#00ff88" letter-spacing="0.5">
        cybershieldx.in
      </text>

      <!-- Version Pill -->
      <g transform="translate(235, 0)">
        <rect width="130" height="38" rx="10" fill="rgba(0, 212, 255, 0.12)" stroke="rgba(0, 212, 255, 0.4)" stroke-width="1.2"/>
        <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#00d4ff" letter-spacing="1">
          v33.0.0
        </text>
      </g>

      <!-- Live Operational Status Indicator -->
      <g transform="translate(385, 10)">
        <circle cx="6" cy="9" r="4.5" fill="#00ff88" filter="url(#softGlow)"/>
        <text x="20" y="14" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#cbd5e1" letter-spacing="1">
          SYSTEMS ACTIVE &amp; SECURE
        </text>
      </g>
    </g>
  </g>
</svg>
