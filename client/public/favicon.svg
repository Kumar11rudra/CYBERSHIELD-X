<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#05152e"/>
      <stop offset="70%" stop-color="#020814"/>
      <stop offset="100%" stop-color="#01040a"/>
    </radialGradient>

    <!-- Neon Cyber Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>

    <!-- Reverse Gradient for Accents -->
    <linearGradient id="cyberGradRev" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <!-- Shield Inner Fill Gradient -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071b38"/>
      <stop offset="100%" stop-color="#020914"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base Icon Background for high visibility on light & dark search engines -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#cyberGrad)" stroke-width="4" opacity="0.35"/>

  <!-- Subtle Cyber Grid in Icon Background -->
  <g opacity="0.08" stroke="#00d4ff" stroke-width="1.5">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="256" cy="240" r="140" fill="#00d4ff" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- Outer Cyber Shield Body -->
  <path
    d="M256 46 L430 114 L430 286 C430 380 256 458 256 458 C256 458 82 380 82 286 L82 114 Z"
    fill="url(#shieldFill)"
    stroke="url(#cyberGrad)"
    stroke-width="16"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Inner High-Tech Shield Trim -->
  <path
    d="M256 78 L398 134 L398 276 C398 350 256 422 256 422 C256 422 114 350 114 276 L114 134 Z"
    fill="none"
    stroke="url(#cyberGradRev)"
    stroke-width="5"
    opacity="0.5"
    stroke-dasharray="16 8"
  />

  <!-- Circuit Connection Tracks (Left Side) -->
  <g stroke="#00d4ff" stroke-width="4" fill="none" opacity="0.8">
    <path d="M140 190 L180 190 L205 215"/>
    <circle cx="140" cy="190" r="6" fill="#00d4ff"/>
    <path d="M130 270 L170 270 L195 245"/>
    <circle cx="130" cy="270" r="6" fill="#00d4ff"/>
  </g>

  <!-- Radar Arc Tracks (Right Side) -->
  <g stroke="#00ff88" stroke-width="3" fill="none" opacity="0.7">
    <path d="M340 180 A 90 90 0 0 1 380 270" stroke-dasharray="8 6"/>
    <circle cx="370" cy="225" r="5" fill="#00ff88"/>
  </g>

  <!-- The Bold Central 'X' Symbol (Outer Neon Cyan/Green) -->
  <path
    d="M176 172 L234 246 L176 320 L214 320 L256 266 L298 320 L336 320 L278 246 L336 172 L298 172 L256 226 L214 172 Z"
    fill="url(#cyberGrad)"
    filter="url(#neonGlow)"
  />

  <!-- Inner Bright White Core of 'X' for High Legibility at 16px and 48px -->
  <path
    d="M188 180 L238 246 L188 312 L206 312 L256 252 L306 312 L324 312 L274 246 L324 180 L306 180 L256 240 L206 180 Z"
    fill="#ffffff"
  />

  <!-- Center Security Core Anchor -->
  <circle cx="256" cy="246" r="14" fill="#020814" stroke="url(#cyberGrad)" stroke-width="3"/>
  <circle cx="256" cy="246" r="5" fill="#00ff88"/>
</svg>
