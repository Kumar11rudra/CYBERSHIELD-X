<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Cyber Radial Base -->
    <radialGradient id="avatarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#071b38"/>
      <stop offset="55%" stop-color="#020814"/>
      <stop offset="100%" stop-color="#010308"/>
    </radialGradient>

    <!-- Neon Cyber Gradients -->
    <linearGradient id="neonGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>

    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a254c"/>
      <stop offset="100%" stop-color="#020a17"/>
    </linearGradient>

    <!-- Holographic Filters -->
    <filter id="intenseBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b1"/>
      <feGaussianBlur stdDeviation="18" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="avatarClip">
      <circle cx="256" cy="256" r="250"/>
    </clipPath>
  </defs>

  <g clip-path="url(#avatarClip)">
    <!-- Base Background Circle -->
    <circle cx="256" cy="256" r="256" fill="url(#avatarBg)"/>

    <!-- Outer Neon Ring -->
    <circle cx="256" cy="256" r="248" fill="none" stroke="url(#neonGlowGrad)" stroke-width="4" opacity="0.6"/>

    <!-- Radar / Orbital Targeting Rings -->
    <circle cx="256" cy="256" r="215" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.35"/>
    <circle cx="256" cy="256" r="175" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3"/>

    <!-- Holographic Background Bloom -->
    <circle cx="256" cy="240" r="130" fill="#00d4ff" opacity="0.2" filter="url(#intenseBloom)"/>

    <!-- ═══════ THE CYBERSHIELD X DEFENSE EMBLEM ═══════ -->
    <g transform="translate(256, 250) scale(0.85) translate(-256, -250)">
      <!-- Outer Shield Body -->
      <path
        d="M256 46 L430 114 L430 286 C430 380 256 458 256 458 C256 458 82 380 82 286 L82 114 Z"
        fill="url(#shieldBg)"
        stroke="url(#neonGlowGrad)"
        stroke-width="14"
        stroke-linejoin="round"
        filter="url(#softBloom)"
      />

      <!-- Inner Shield Trim -->
      <path
        d="M256 78 L398 134 L398 276 C398 350 256 422 256 422 C256 422 114 350 114 276 L114 134 Z"
        fill="none"
        stroke="url(#neonGlowGrad)"
        stroke-width="4.5"
        opacity="0.6"
        stroke-dasharray="16 8"
      />

      <!-- Circuit Nodes (Left Blue Side) -->
      <g stroke="#00d4ff" stroke-width="4" fill="none" opacity="0.9">
        <path d="M140 190 L180 190 L205 215"/>
        <circle cx="140" cy="190" r="6" fill="#00d4ff"/>
        <path d="M130 270 L170 270 L195 245"/>
        <circle cx="130" cy="270" r="6" fill="#00d4ff"/>
      </g>

      <!-- Radar arcs (Right Green Side) -->
      <g stroke="#00ff88" stroke-width="3.5" fill="none" opacity="0.8">
        <path d="M340 180 A 90 90 0 0 1 380 270" stroke-dasharray="8 6"/>
        <circle cx="370" cy="225" r="5" fill="#00ff88"/>
      </g>

      <!-- The Central 'X' Symbol (Outer Neon Cyan/Green) -->
      <path
        d="M176 172 L234 246 L176 320 L214 320 L256 266 L298 320 L336 320 L278 246 L336 172 L298 172 L256 226 L214 172 Z"
        fill="url(#neonGlowGrad)"
        filter="url(#intenseBloom)"
      />

      <!-- Inner Pure White Core of 'X' -->
      <path
        d="M188 180 L238 246 L188 312 L206 312 L256 252 L306 312 L324 312 L274 246 L324 180 L306 180 L256 240 L206 180 Z"
        fill="#ffffff"
      />

      <!-- Security AI Core Eye -->
      <circle cx="256" cy="246" r="14" fill="#020814" stroke="url(#neonGlowGrad)" stroke-width="3"/>
      <circle cx="256" cy="246" r="5" fill="#00ff88" filter="url(#softBloom)"/>
    </g>

    <!-- Futuristic AI Crosshair HUD Marks -->
    <g stroke="#00d4ff" stroke-width="2" opacity="0.75">
      <line x1="256" y1="12" x2="256" y2="30"/>
      <line x1="256" y1="482" x2="256" y2="500"/>
      <line x1="12" y1="256" x2="30" y2="256"/>
      <line x1="482" y1="256" x2="500" y2="256"/>
    </g>
  </g>
</svg>
